services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trendhive
      POSTGRES_PASSWORD: trendhive
      POSTGRES_DB: trendhive
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trendhive"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
  mailhog:
    image: mailhog/mailhog:v1.0.1
    profiles: ["mail"]
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql://trendhive:trendhive@postgres:5432/trendhive
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://trendhive:trendhive@postgres:5432/trendhive
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailhog
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://trendhive:trendhive@postgres:5432/trendhive
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailhog
    command: ["node", "dist/worker.js"]
    healthcheck:
      disable: true
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
volumes:
  postgres-data:
  redis-data:
